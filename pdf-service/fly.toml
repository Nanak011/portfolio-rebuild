# Generated for the portfolio PDF-generation backend.
# Rename `app` to something unique to your Fly.io account before deploying,
# and update PDF_SERVICE_URL in the web app's .env to match.
app = "portfolio-pdf-service"
primary_region = "sin" # Singapore — closest region to Kathmandu; change if needed

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
